services:
  neo4j:
    image: neo4j:5.26.31-community
    ports:
      - "127.0.0.1:17474:7474"
      - "127.0.0.1:17687:7687"
    environment:
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_allowlist: apoc.meta.*
      NEO4J_dbms_security_procedures_unrestricted: apoc.meta.*
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    volumes:
      - neo4j-data:/data
volumes:
  neo4j-data:

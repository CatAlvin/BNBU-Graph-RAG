name: Verify routing data
on: [push, pull_request]
permissions:
  contents: read
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/verify_evaluation.py
      - run: python -m compileall -q agents GPT2.py GPT2_router.py scripts
